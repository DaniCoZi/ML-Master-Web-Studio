<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: #f0f4f8; margin: 0; }
  .forum-topbar {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    padding: 14px 0;
    box-shadow: 0 2px 20px rgba(0,0,0,0.3);
    position: sticky; top: 0; z-index: 100;
  }
  .forum-topbar .brand { color: #e94560; font-weight: 700; font-size: 1.4rem; text-decoration: none; letter-spacing: 1px; }
  .forum-topbar .nav-link { color: rgba(255,255,255,0.75); font-size: 0.9rem; text-decoration: none; padding: 6px 14px; border-radius: 20px; transition: all 0.2s; }
  .forum-topbar .nav-link:hover, .forum-topbar .nav-link.active { background: rgba(233,69,96,0.2); color: #e94560; }
  .forum-topbar .user-badge { background: rgba(255,255,255,0.1); color: #fff; border-radius: 20px; padding: 6px 14px; font-size: 0.85rem; }
  .forum-topbar .btn-logout { background: rgba(233,69,96,0.15); color: #e94560; border: 1px solid rgba(233,69,96,0.3); border-radius: 20px; padding: 6px 16px; font-size: 0.85rem; text-decoration: none; transition: all 0.2s; }
  .forum-topbar .btn-logout:hover { background: #e94560; color: #fff; }
  .forum-topbar .btn-new-post { background: linear-gradient(135deg, #e94560, #c73652); color: #fff; border: none; border-radius: 20px; padding: 7px 18px; font-size: 0.85rem; text-decoration: none; font-weight: 600; transition: all 0.2s; }
  .forum-topbar .btn-new-post:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(233,69,96,0.4); color: #fff; }
</style>
<nav class="forum-topbar">
  <div class="container d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-3">
      <a class="brand" href="{{ url_for('main.index') }}">REVELU</a>
      <a class="nav-link {% if request.endpoint == 'forum_pages.index' %}active{% endif %}" href="{{ url_for('forum_pages.index') }}">
        <i class="bi bi-house-door me-1"></i>Foros
      </a>
      <a class="nav-link {% if request.endpoint == 'forum_pages.posts_page' %}active{% endif %}" href="{{ url_for('forum_pages.posts_page') }}">
        <i class="bi bi-chat-dots me-1"></i>Publicaciones
      </a>
    </div>
    <div class="d-flex align-items-center gap-3">
      {% if current_user.is_authenticated %}
        <span class="user-badge"><i class="bi bi-person-circle me-1"></i>{{ current_user.nombre or current_user.email }}</span>
      {% endif %}
      <a class="btn-new-post" href="{{ url_for('forum_pages.new_post_page') }}">
        <i class="bi bi-plus-lg me-1"></i>Nueva publicación
      </a>
      <a class="btn-logout" href="{{ url_for('auth.logout') }}"><i class="bi bi-box-arrow-right me-1"></i>Salir</a>
    </div>
  </div>
</nav>
