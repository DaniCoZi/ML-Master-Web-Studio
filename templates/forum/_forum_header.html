{# templates/forum/_forum_header.html #}
<header class="forum-header">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <!-- Logo / Marca -->
      <a class="navbar-brand" href="{{ url_for('main.index') }}">
        Revelu
      </a>

      <!-- Botón hamburguesa en móvil (opcional) -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#forumNavbar" aria-controls="forumNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="forumNavbar">
        <!-- Links principales izquierda -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <li class="nav-item">
            <a class="nav-link{% if request.endpoint == 'forum_pages.index' %} active{% endif %}"
               href="{{ url_for('forum_pages.index') }}">
              Foros
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link{% if request.endpoint == 'forum_pages.posts_page' %} active{% endif %}"
               href="{{ url_for('forum_pages.posts_page') }}">
              Publicaciones
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link{% if request.endpoint == 'forum_pages.new_post_page' %} active{% endif %}"
               href="{{ url_for('forum_pages.new_post_page') }}">
              Nueva publicación
            </a>
          </li>
        </ul>

        <!-- Zona derecha: usuario + cerrar sesión -->
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          {# Si quieres mostrar el email o nombre #}
          {% if current_user.is_authenticated %}
          <li class="nav-item d-flex align-items-center me-2 text-light small">
            <i class="bi bi-person-circle me-1"></i>
            {{ current_user.nombre or current_user.email }}
          </li>
          {% endif %}

          <li class="nav-item">
            <a class="btn btn-outline-light btn-sm"
               href="{{ url_for('auth.logout') }}">
              <i class="bi bi-box-arrow-right me-1"></i>
              Cerrar sesión
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
